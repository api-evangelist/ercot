# ---- The missing half of the auth contract ----------------------------------------
# The published spec declares only the APIM subscription key. Every call also requires an
# Azure AD B2C ID token; without it all calls are rejected.
- target: $.components.securitySchemes
  update:
    b2cIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Azure AD B2C ID token obtained from the B2C_1_PUBAPI-ROPC-FLOW token endpoint. Valid for one
        hour, cannot be refreshed. Documented at
        https://developer.ercot.com/applications/pubapi/user-guide/registration-and-authentication/
        but absent from the published specification.
    ercotB2C:
      type: oauth2
      description: Azure AD B2C ROPC user flow that issues the ID token.
      flows:
        password:
          tokenUrl: https://ercotb2c.b2clogin.com/ercotb2c.onmicrosoft.com/B2C_1_PUBAPI-ROPC-FLOW/oauth2/v2.0/token
          scopes:
            openid: Standard OIDC scope; the only value in scopes_supported.
            offline_access: Requests a refresh token alongside the ID token.

- target: $.security
  update:
    - apiKeyHeader: []
      b2cIdToken: []

# ---- Rate limiting and gateway errors, documented but not specified ---------------
- target: $.info
  update:
    x-rate-limit:
      requests: 30
      period: minute
      status: 429
      body: '{"error_key": "throttled", "error_message": "Too Many Requests"}'
      docs: https://developer.ercot.com/applications/pubapi/known-limits/
    x-geographic-restriction: Requests originating outside the United States are blocked on *.ercot.com.
    x-download-limit:
      files: 1000
      scope: per historic-file download, API and Web UI

- target: $.components.responses
  update:
    Unauthorized:
      description: Missing or invalid credentials — both the subscription key and the ID token are required.
      content:
        application/json:
          schema:
            type: object
            properties:
              error_key: { type: string }
              error_message: { type: string }
    TooManyRequests:
      description: Rate limit of 30 requests per minute exceeded.
      content:
        application/json:
          schema:
            type: object
            properties:
              error_key: { type: string }
              error_message: { type: string }
          example:
            error_key: throttled
            error_message: Too Many Requests

