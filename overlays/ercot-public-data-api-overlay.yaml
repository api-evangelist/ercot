# ---- Domain semantics the spec leaves implicit ------------------------------------
- target: $.info
  update:
    x-market-timezone: America/Chicago
    x-dst-convention: >-
      DSTFlag and repeatHourFlag disambiguate the repeated hour at the fall-back DST transition;
      clients must carry both to key rows uniquely.
    x-response-shape: >-
      Report responses are column-oriented — fields[] is a runtime dictionary (name, label,
      dataType, searchable, sortable, hasRange) describing the untyped data[] payload.
    x-emil-id-convention: >-
      EMIL ids take the form NP<protocol-section>-<number>-<suffix> (CD current day, ER extract
      report, EX extract, M manual corrections), lower-cased in URL paths.
