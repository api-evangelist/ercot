source: https://www.npmjs.com/package/@missionsquad/mcp-ercot (published tool list) bound to openapi/ercot-public-data-api-openapi.json
description: 'Binds every tool exposed by the only known ERCOT MCP server — the third-party @missionsquad/mcp-ercot
  — to the ERCOT Public Data API operation that backs it, so each tool inherits a real inputSchema (that
  operation''s query parameters) instead of a guessed one. The server is not ERCOT-published; ERCOT operates
  no MCP surface of its own. The picture the crosswalk exposes is a narrow agent surface over a wide API:
  34 of 106 operations have a tool, all of them Day-Ahead / Real-Time market prices, ancillary services
  and 60-day disclosures. The entire renewables, load, outage and real-time grid-condition half of the
  catalog — wind and solar production, actual system load, seven-day load forecasts, hourly resource outage
  capacity, SCED shadow prices — has no tool at all, and neither does the product catalog itself.'
surfaces:
  openapi:
    file: openapi/ercot-public-data-api-openapi.json
    operations: 106
    gated: false
    note: Spec is public on GitHub; the API itself requires a subscription key plus a B2C ID token.
  graphql: null
  mcp:
    server: '@missionsquad/mcp-ercot'
    official: false
    transport: stdio
    tools_list_probe: not applicable — stdio server, no hosted endpoint to introspect anonymously
    source: tool names and descriptions taken verbatim from the published package README
