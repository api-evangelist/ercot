description: >-
  The ERCOT Public Data API has a deliberately small, generic object model — 14 schemas that wrap a
  very large catalog of data. The domain richness is not in the schemas but in the EMIL catalog:
  106 report endpoints across 36 EMIL products, each returning the SAME Report envelope with a
  self-describing fields[] dictionary and an untyped data[] payload. That is the defining modelling
  decision of this API: the row shape of a settlement-point-price report and a wind-forecast report
  are indistinguishable at the schema level and only discoverable at runtime.
root: Product
entities:
- name: Product
  description: An EMIL (ERCOT Market Information List) data product, keyed by emilId (e.g. NP4-190-CD).
  identifier: emilId
  key_fields: [emilId, name, description, status, reportTypeId, audience, generationFrequency, securityClassification, lastUpdated, firstRun, channel, postingType, market, xsdName, certificateRole, fileType, misDisplayDuration, archiveDuration, protocolRules]
  operations: [getListForProducts, getProduct]
- name: Artifact
