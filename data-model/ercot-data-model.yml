identifiers:
  emilId: >-
    EMIL product id of the form NP<section>-<number>-<suffix>, e.g. NP4-190-CD. Section digit maps to
    the ERCOT Nodal Protocol section (NP3 outages/disclosures, NP4 day-ahead market, NP6 real-time
    market). Suffix: CD = current day, ER = extract/report, EX = extract, M = manual/corrections.
    Lower-cased in URL paths (np4-190-cd).
  reportTypeId: numeric ERCOT report type identifier, stable across the MIS and the API.
  docId: numeric archive document id.
catalog_scale:
  emil_products_in_spec: 35
  report_data_endpoints: 102
  catalog_endpoints: 3
  version_endpoint: 1
  total_operations: 106
  note: >-
    102 getData* report endpoints, plus getListForProducts (GET /), getProduct (GET /{emilId}),
    getProductHistory (GET /archive/{emilId}) and getVersion (GET /version).
untyped_payload:
  field: Report.data
  declared_type: object
  note: >-
    Row data is returned positionally aligned to fields[]; the spec does not model the row shape for
    any of the 102 report endpoints. Clients must read fields[] to interpret data[].
