description: >-
  ERCOT does not use RFC 9457 problem+json. Application errors return a flat `Exception` object
  (timestamp, code, status, message, data) as application/json; gateway-level rejections from Azure
  API Management return a different, smaller envelope (error_key, error_message). The OpenAPI is
  uniform — all 106 operations declare exactly 400, 403 and 404 — so the catalog below is
  provider-wide rather than per-operation. 401 and 429 are real and documented in prose but absent
  from the spec, which is the single largest error-contract gap in this API.
envelopes:
- name: Exception
  media_type: application/json
  source: openapi/ercot-public-data-api-openapi.json#/components/schemas/Exception
  fields:
    timestamp: date-time the error occurred
    code: integer error code
    status: status string
    message: human-readable message
    data: free-form object for additional context
  used_by: [400, 403, 404]
- name: Azure API Management gateway error
  media_type: application/json
  source: https://developer.ercot.com/applications/pubapi/known-limits/
  fields:
    error_key: machine-readable key, e.g. throttled
    error_message: human-readable message, e.g. Too Many Requests
  used_by: [401, 429]
