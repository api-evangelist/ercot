description: >-
  ERCOT ships no client SDK for the Public Data API in any package registry. The developer portal
  documents the API with raw cURL / JavaScript fetch / Java HttpClient / Python requests snippets
  rather than a library, and the only first-party client code in the ERCOT GitHub organization is a
  Java SAMPLE client for the SOAP Web Services estate. Everything else that installs is
  third-party. Recorded here honestly: no `official: true` package exists in any registry, so no
  SDK count is claimed for ERCOT.
official_sdks: 0
packages: []
first_party_source:
- name: ews-client
  language: java
  registry: github
  url: https://github.com/ercot/ews-client
  description: Sample ERCOT Web Services client, published by the ERCOT GitHub organization.
  official: true
  published_package: false
  note: >-
    Source-only sample for the certificate-authenticated SOAP estate — not a published Maven
    artifact and not a client for the Public Data API. Not counted as an SDK.
- name: api-specs
  language: n/a
  registry: github
  url: https://github.com/ercot/api-specs
  description: The canonical ERCOT specification repository — the Public Data API OpenAPI, plus EWS/MarkeTrak/Retail WSDLs and the XSD estate.
  official: true
  published_package: false
