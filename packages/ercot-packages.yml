    Third-party convenience wrapper (v0.1.2). Project URLs still point at a placeholder GitHub
    account; unaffiliated with ERCOT despite the name.
- language: javascript
  registry: npm
  name: '@missionsquad/mcp-ercot'
  url: https://www.npmjs.com/package/@missionsquad/mcp-ercot
  install: npm install @missionsquad/mcp-ercot
  official: false
  note: >-
    MCP server for the ERCOT Public Data API's DAM/RTM endpoints, built on a TypeScript client
    generated from ERCOT's own OpenAPI. See mcp/ercot-mcp.yml.
