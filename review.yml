    httpStatus: 200
  - url: https://data.ercot.com/
    httpStatus: 200
    note: ERCOT Data Access Portal (React SPA), historical data product search.
  - url: https://www.ercot.com/misapp/GetReports.do?reportTypeId=12300
    httpStatus: 200
    note: 1,383,192 bytes. Anonymous MIS public report listing (LMPs by resource node).
  - url: https://www.ercot.com/misdownload/servlets/mirDownload?mimic_duns=000000000&doclookupId=1255147007
    httpStatus: 200
    note: 7,475-byte ZIP downloaded anonymously. Proves the open bulk surface.
  - url: https://www.ercot.com/api/1/services/read/dashboards/fuel-mix.json
    httpStatus: 200
    note: 122,111 bytes of real generation-by-fuel data, anonymous. Undocumented internal feed.
  - url: https://www.ercot.com/api/1/services/read/dashboards/daily-prc.json
    httpStatus: 200
    note: 330,165 bytes, anonymous. Undocumented internal feed.
