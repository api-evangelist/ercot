    httpStatus: 200
    note: 83,359 bytes, anonymous. Undocumented internal feed.
  - url: https://www.ercot.com/api/1/services/read/dashboards/combine-wind-solar.json
    httpStatus: 200
    note: 17,657 bytes, anonymous. Undocumented internal feed.
  - url: https://www.ercot.com/api/1/services/read/dashboards/todays-outlook.json
    httpStatus: 403
    note: Blocked. Confirms these feeds are not a supported public API.
  - url: https://api.ercot.com/api/public-reports/rptesr-m/4_sec_esr_charging_mw
    httpStatus: 404
    note: >-
      Guessed ESR path against the public-reports base. 404, so the ESR API is NOT on this base
      path. No ESR base URL is asserted in apis.yml.
  - url: https://www.smartmetertexas.com/
    httpStatus: 000
    note: >-
      Connection failed from this vantage point. Recorded for completeness only — Smart Meter
      Texas is a TDU-operated portal, outside ERCOT's estate, and is not profiled here.
  notListedAsApis:
  - name: ercot.com dashboard JSON feeds
    reason: >-
      Anonymous and real, but undocumented internal endpoints with no published contract and
      no stability commitment (one of five probed returns 403). Recorded as evidence for
      marketDataOpen, deliberately excluded from apis[].
  - name: MIS public report downloads (GetReports.do / mirDownload servlets)
    reason: >-
      A genuinely open bulk file-download surface, not an API with a published contract.
      Recorded as evidence for marketDataOpen and linked under common[] as OpenData.
  - name: Market Data Transparency (MDT) extracts
    reason: >-
      ercot/api-specs/mdt ships MarketDataTransparency.xsd plus 31 PR50024_MDT_* / PR80027_MDT_*
      XSLT transforms. This is a settlement/registration extract format for certified Market
      Participants, not a documented API, and not a consumer-data API.
sources:
- url: https://developer.ercot.com/
  type: DeveloperPortal
  note: Confirmed live. Lists EWS, MarkeTrak, Public Data API, ESR API, Retail API, NAESB guide.
- url: https://developer.ercot.com/sitemap.xml
  type: Sitemap
  note: 164 URLs. Used to enumerate the documented API set.
- url: https://developer.ercot.com/search/search_index.json
  type: SearchIndex
  note: 549 indexed documents. Source for verbatim auth, rate-limit, and geo-restriction wording.
- url: https://github.com/ercot/api-specs
  type: SourceCode
  note: ERCOT's public contract repository — pubapi OpenAPI, EWS/MarkeTrak/Retail WSDLs and XSDs.
- url: https://apiexplorer.ercot.com/
  type: APIExplorer
  note: Azure APIM portal. Self-serve signup and subscription keys.
- url: https://www.missiondata.io/news/2018/2/2/smart-meter-texas-goes-big-settlement-calls-for-green-button-connect-api
  type: Reference
  note: >-
    Corroborates that the Texas Green Button Connect obligation was settled at the PUCT and
    lands on the Joint TDUs who operate Smart Meter Texas — not on ERCOT.
actions:
  openapiHarvested: true
  specsCount: 1
  specsPath: openapi/ercot-public-data-api-openapi.json
  provenance:
    sourceURL: https://raw.githubusercontent.com/ercot/api-specs/main/pubapi/pubapi-apim-api.json
    fetchDate: '2026-07-27'
    httpStatus: 200
    bytes: 1608883
    parsed: true
    parser: python3 json
    openapiVersion: 3.0.1
    unmodified: true
  apisYmlCreated: true
  apisListed: 5
  fabricationCheck: >-
    No host, endpoint, scope, or specification was invented. The single saved spec is ERCOT's
    own file byte-for-byte. Every URL in apis.yml was probed and returned 200 except the
    apiexplorer api-details deep links, which are client-side fragments on a page that returns
    200. The ESR API is listed without a baseURL because the only candidate path returned 404.
