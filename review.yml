    httpStatus: 200
    note: Anonymous OIDC discovery document retrieved and parsed. See authModel.oauth.wellKnown.
  - url: https://raw.githubusercontent.com/ercot/api-specs/main/pubapi/pubapi-apim-api.json
    httpStatus: 200
    note: 1,608,883 bytes. Parsed as OpenAPI 3.0.1. THE harvested contract.
  - url: https://github.com/ercot/api-specs
    httpStatus: 200
    note: ERCOT's own public specification repository (org id 103006572). 112 tracked paths.
