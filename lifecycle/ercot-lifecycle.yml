  rfc8594: false
  governance: >-
    Endpoint retirements are announced through ERCOT Market Notices (e.g. PR447_RTC+B) and mirrored
    on the Deprecation Notices page with a deprecation date, a last-run date and — where a successor
    exists — the replacement endpoint.
  note: >-
    The response Link schema includes a standard `deprecation` attribute, so the payload shape can
    carry a deprecation URI, but no operation in the published spec is marked deprecated.
