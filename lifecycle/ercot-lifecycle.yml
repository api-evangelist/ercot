description: >-
  ERCOT runs the Public Data API on a numbered release train (YYYY-Rn) tied to market
  implementations rather than to semantic API versions — the API itself has been "Version 1.0"
  since the February 2024 GA. Deprecation is real and published: a dated Deprecation Notices page
  lists retiring endpoints with last-run dates and, where applicable, the replacement endpoint,
  each tied back to a formal ERCOT Market Notice. What is missing is machine-readable signalling —
  there is no Sunset or Deprecation HTTP header contract, and no operation in the OpenAPI carries
  `deprecated: true` even for endpoints the notices page has already retired.
