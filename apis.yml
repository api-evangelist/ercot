- aid: ercot:ercot-marketrak-api
  name: ERCOT MarkeTrak API
  description: >-
    SOAP API over MarkeTrak, ERCOT's retail-market issue tracking system, supporting
    QueryList, QueryDetail, Update, and Submit operations against retail transaction issues.
    Applications must pass ERCOT certification at one of three levels before they may call
    the service in production, and access is limited to registered Market Participants.
  humanURL: https://developer.ercot.com/applications/marketrak/MarkeTrak_API_Dev_v1_2/
  baseURL: https://misapi.ercot.com/marketrakAPI/
