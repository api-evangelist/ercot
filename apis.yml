- aid: ercot:ercot-esr-public-data-api
  name: ERCOT ESR Public Data API
  description: >-
    Energy Storage Resource public data, launched May 29, 2025 per the ERCOT Public Data API
    release notes, beginning with four-second ESR charging MW telemetry
    (GET /rptesr-m/4_sec_esr_charging_mw). Documented in the ERCOT API Explorer as the
    esrapi-apim-api product. No machine-readable specification is published for this API in
    ERCOT's public api-specs repository, and no base URL was independently confirmed, so none
    is asserted here. Access follows the same subscription-key plus B2C ID token model as the
    Public Data API.
  humanURL: https://apiexplorer.ercot.com/api-details#api=esrapi-apim-api
