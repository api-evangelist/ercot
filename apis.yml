aid: ercot
url: https://raw.githubusercontent.com/api-evangelist/ercot/refs/heads/main/apis.yml
name: ERCOT
kind: company
description: >-
  The Electric Reliability Council of Texas (ERCOT) is the independent system operator that
  manages the flow of electric power to roughly 27 million Texas customers on the ERCOT
  Interconnection, running the wholesale Day-Ahead and Real-Time energy markets, ancillary
  services, congestion revenue rights, and retail switching for the competitive Texas market.
  Its home market is the United States (Texas). ERCOT sits at the wholesale/system-operator
  layer of the energy value chain, upstream of the transmission and distribution utilities
  (Oncor, CenterPoint, AEP Texas, TNMP) and the retail electric providers that serve end
  customers. Its API posture is a clean split: market and grid data are genuinely open —
  ERCOT publishes a real, versioned OpenAPI 3.0 for the Public Data API covering 106 EMIL
  data-product endpoints (locational marginal prices, settlement point prices, system load,
  wind and solar production, ancillary services, outage capacity), and the Market Information
  System still serves public report archives anonymously with no account at all. Consumer
  energy data is a different story: ERCOT operates no consumer usage API and implements no
  Green Button / ESPI surface. Texas residential interval data lives in Smart Meter Texas,
  which is operated by the joint Transmission and Distribution Utilities under PUCT oversight,
  not by ERCOT. The market-participant SOAP estate (ERCOT Web Services, MarkeTrak, Retail API)
  is documented publicly on GitHub but reachable only by certified market participants.
