- aid: ercot:ercot-web-services
  name: ERCOT Web Services (EWS)
  description: >-
    ERCOT's SOAP web-services estate for Nodal market participants — the Market Information
    Service, Market Transaction Service (bid and offer submission via BidSet), Resource
    Parameter Transaction Service, Outage Scheduling Services, Verbal Dispatch Instructions,
    and WS-Notifications callbacks. WSDL and XSD contracts are published openly on GitHub,
    but the runtime endpoints are reachable only by registered ERCOT Market Participants
    holding an ERCOT digital certificate; the shipped WSDL carries a placeholder
    soap:address of https://dummyhost:0000/ so no runtime base URL is asserted here.
  humanURL: https://developer.ercot.com/applications/ews/Introduction/
  tags:
  - SOAP
  - Market Participants
  - Bids
  - Outages
  - Energy Markets
