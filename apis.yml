apis:
- aid: ercot:ercot-public-data-api
  name: ERCOT Public Data API
  description: >-
    RESTful access to ERCOT Market Information List (EMIL) public data products — 106
    documented endpoints spanning real-time and day-ahead locational marginal prices,
    settlement point prices, SCED system lambda and shadow prices, actual system load by
    weather and forecast zone, wind and solar power production actuals and forecasts,
    ancillary service offers and awards, hourly resource outage capacity, and 60-day
    SCED/DAM disclosure reports, plus historic file archives retained at least seven years.
    Data is public and free, but every call requires a free self-serve Azure API Management
    subscription key plus an Azure AD B2C ID token. Rate limited to 30 requests per minute;
    requests from outside the United States are blocked.
  humanURL: https://developer.ercot.com/applications/pubapi/user-guide/using-api/
  baseURL: https://api.ercot.com/api/public-reports
