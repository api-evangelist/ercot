- aid: ercot:ercot-retail-api
  name: ERCOT Retail API
  description: >-
    SOAP web service supporting Texas Standard Electronic Transactions (TX SET) between
    ERCOT, Transmission and Distribution Service Providers, and Retail Electric Providers —
    the machinery behind retail switching, enrollment, and move-in/move-out in the
    competitive Texas market. Contracts are published openly; the service itself is
    restricted to certified Market Participants.
  humanURL: https://developer.ercot.com/api_specifications/retail/retail/
