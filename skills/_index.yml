shared_rules:
- Two credentials on every call — Ocp-Apim-Subscription-Key plus Authorization Bearer ID token.
- ID tokens last one hour and cannot be refreshed.
- 30 requests per minute; 429 returns {"error_key":"throttled"} with no Retry-After.
- Requests from outside the United States are blocked at the edge.
- All 106 operations are GET; there is no write surface and no idempotency contract.
- Errors are a flat Exception envelope, not RFC 9457 problem+json.
- Column semantics come from the runtime fields[] dictionary, not the spec.
- Market time is America/Chicago; key time series on DSTFlag and repeatHourFlag.
